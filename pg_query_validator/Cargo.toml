[package]
name = "pg_query_validator"
version = "0.1.0"
edition = "2021"
authors = ["Alex Shagrov <ericblack@mail.ru>"]
description = "PostgreSQL extension for automatic query validation using Rust"
license = "BSD 2-Clause"
repository = "https://github.com/BlackEric001/PgExtensionTemplate"
keywords = ["postgresql", "extension", "validation", "security"]
categories = ["database", "command-line-utilities"]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["pg18"]
pg16 = ["pgrx/pg16", "pgrx-tests/pg16"]
pg17 = ["pgrx/pg17", "pgrx-tests/pg17"]
pg18 = ["pgrx/pg18", "pgrx-tests/pg18"]
pg_test = []

[dependencies]
pgrx = "0.19.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
once_cell = "1.19"
log = "0.4"

[dev-dependencies]
pgrx-tests = "0.19.3"